<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VeraTrack · Cámaras frigoríficas</title>
  <link rel="icon" type="image/png" href="assets/img/logo.png">

</head>
<body>

  <header class="topbar">
    <a class="brand" href="index.html">
      <img class="brand-banner" src="assets/img/logoBANNER-96.png" alt="Veraleza" width="445" height="96">
    </a>
    <nav class="nav">
      <a href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg>
        <span>Centro de control</span>
      </a>
      <a href="flota.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 8h13v9H1zM14 11h4l4 3v3h-8z"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="19" r="2"/></svg>
        <span>Flota</span>
      </a>
      <a href="camaras.html" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M4 6l16 12M20 6L4 18M2 12h20"/></svg>

        <div class="kpi k-cold"><div class="v" id="kPower">–</div><div class="l">kW frío</div></div>
      </div>
    </div>
  </header>

  <main class="page-body">
    <div class="page-head">
      <div>
        <h1>Cámaras frigoríficas</h1>
        <div class="sub">Plataforma Logística Veraleza · monitorización en tiempo real · lecturas cada 5 s</div>
      </div>
    </div>

    <div class="alert-banner" id="alertBanner">
      <span class="icon">⚠</span>
      <span id="alertBannerTxt"></span>
    </div>

    <div class="cam-grid" id="camGrid"></div>

    <div class="section-title">Registro de eventos</div>
    <div class="alert-log" id="alertLog"></div>
  </main>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/camaras.js"></script>
